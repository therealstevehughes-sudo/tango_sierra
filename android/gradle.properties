org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
# Kept lean deliberately (this machine has 7.9GB total RAM, often nearly
# fully committed) — daemon off and no parallel execution trade build
# speed for a much lower peak memory footprint, and avoid leaving a
# resident Gradle process holding memory after the build finishes.
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
