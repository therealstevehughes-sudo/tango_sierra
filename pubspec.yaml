name: venurite
description: "VenuRite - compliance and task management for hospitality kitchens."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+2

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  intl: any
  flutter_riverpod: ^3.3.2
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.7
  pdf: ^3.11.1
  supabase_flutter: ^2.8.0
  file_picker: ^8.1.7
  # Phase B2 — raw REST calls against Supabase's PostgREST endpoint,
  # carrying whichever access token the current session actually has (PIN
  # sessions never touch supabase_flutter's own auth/session state, so its
  # ambient client can't be used for these calls — see BackendRestClient).
  http: ^1.6.0
  # Sprint 032 P0 photo evidence — the ONLY new dependency this sprint.
  # image_picker: real camera/gallery capture; returns a stable file path
  # to a JPEG we copy into <documents>/evidence/ (space-efficient bytes on
  # disk, NOT BLOBs in Drift — see PHOTO_EVIDENCE_PLAN.md). image_picker
  # ships its own runtime camera permission flow on Android; iOS needs the
  # NSCameraUsageDescription / NSPhotoLibraryUsageDescription keys in
  # ios/Runner/Info.plist (added with this sprint).
  image_picker: ^1.1.2
  # Live camera capture for evidence photos, Windows + Android (built
  # 2026-09-14). image_picker's own camera option is Android/iOS-only —
  # image_picker_windows explicitly throws UnsupportedError for
  # ImageSource.camera, so Windows tablets got no live-camera option at
  # all, only a file-browser fallback. `camera` is a federated plugin with
  # a real Windows implementation (camera_windows), giving one consistent
  # live-preview-and-capture screen across both platforms rather than
  # relying on each OS's own camera intent. image_picker's gallery/file
  # path stays as the "Upload from Files" alternative on both platforms.
  camera: ^0.11.0+2
  # The `camera` federated plugin does not list a Windows implementation
  # as its own default (only android/ios/web) — camera_windows exists as
  # a real implementation but must be pulled in explicitly for Flutter's
  # plugin resolution to pick it up on Windows.
  camera_windows: ^0.2.6+5
  # Persists the user's chosen camera on Windows (see CameraCaptureScreen)
  # — camera_windows hardcodes lensDirection to `front` for every camera
  # (a known unimplemented TODO in that plugin: no Windows API gives a
  # real front/back distinction), so automatic back-camera detection is
  # unreliable there. Was already a transitive dependency; promoted to
  # direct so it can be imported.
  shared_preferences: ^2.5.5
  # Voice-to-text notes (2026-09-27) — kitchens are a bad typing
  # environment (gloved/wet hands, an angled tablet); a mic button next
  # to any notes field lets staff dictate instead. `record` is a
  # federated plugin like `camera` above, with a real Windows
  # implementation (record_windows, WASAPI-backed) rather than a stub.
  # v5.2.1 hit a real version-skew bug (record_linux, a transitive dep
  # for a platform this app doesn't even target, failed to compile
  # against the resolved record_platform_interface version) that broke
  # the Windows build outright — bumped to 6.1.1 where the federated
  # family's versions are back in sync. record_windows is NOT pinned
  # directly here (unlike camera_windows): confirmed via a real
  # `flutter build windows` that this version of the umbrella package
  # already pulls a working Windows implementation transitively.
  record: ^6.1.1
  # Sprint 034 (Customer Onboarding & Billing Foundation) — renders an
  # invite token as a scannable QR code so a new staff member can join by
  # scanning it (WhatsApp/photo) instead of typing a long code by hand.
  # Pure-Dart CustomPainter, no native platform code.
  qr_flutter: ^4.1.0
  # First-launch "Contact VenuRite" — opens the device's mail app via
  # mailto:. Was already a transitive dependency; promoted to direct so
  # it can be imported.
  url_launcher: ^6.3.2
  # Realtime push to a manager's phone (2026-09-16) -- Firebase project
  # "venurite-a6f64" (Spark/free plan, no cost for FCM). firebase_core
  # initializes the app; firebase_messaging registers this device for
  # push and receives incoming messages. Android only for now (the
  # Firebase app just registered is Android; iOS/web registration and
  # the server-side "who gets pushed for which event" logic are a
  # separate follow-up, not part of this wiring step).
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/VenueRite_favicon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # EHO/audit export (Sprint 031) — Roboto (OFL-licensed, from Google's
  # official fonts repo), bundled so the PDF export can render real
  # Unicode text (names, notes) correctly. See assets/fonts/Roboto-OFL.txt.
  #
  # Branding (2026-09-13): VenuRite logo set — square mark, favicon, and
  # both long lockups (white-background and transparent) for login, web,
  # and any future native splash/launcher work.
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/logos/
    - assets/images/

  # First-Open Experience visual pass (2026-09-22) — Fraunces (SIL OFL,
  # see assets/fonts/Fraunces-OFL.txt), a display serif used ONLY for
  # headlines on the onboarding/marketing screens (splash, value screen,
  # sign-up wizard, billing). Bundled as a real asset — not fetched over
  # the network at runtime (google_fonts' default behaviour) — for the
  # same reason AppTextTheme's own doc comment gives for the rest of the
  # app: a font that can never fail to load. Every other screen's text
  # (including this same wizard's own body copy/labels) stays on the
  # existing device-agnostic system font — this is additive, not a
  # replacement of that decision.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
